[project]
name = "hermes-agent-plugin-hookmyapp"
version = "0.1.0"
description = "HookMyApp WhatsApp platform plugin for Hermes Agent (dev/test packaging only; hermes installs via bare git clone)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["aiohttp>=3.9", "pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
